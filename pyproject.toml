[project]
name = "edgerunner"
version = "0.1.0"
description = "SAM-Road road graph extraction on IGN BD ORTHO tiles (Lightning + Hydra)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.5",
    "torchmetrics>=1.4",
    "hydra-core>=1.3",
    "rasterio>=1.4",
    "affine>=3.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyarrow>=15",
    "numpy",
    "scipy",
    "opencv-python-headless>=4.9",
    "tensorboard>=2.17",
    # imported by third_party/sam_road (model.py, graph_utils.py, dataset.py); wandb is stubbed
    "igraph>=0.11",
    "rtree>=1.3",
    "addict>=2.4",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
clearml = ["clearml>=1.16"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgerunner"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "road_graph_extractor-main"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds the ViT-B model on CPU"]

# CUDA 12 build: the A40 cluster already ran CUDA 12.8 builds, CUDA 13 needs a driver >= 580
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
